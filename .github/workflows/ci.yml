name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download FFmpeg
        shell: pwsh
        run: ./scripts/Setup-FFmpeg.ps1

      - name: Restore
        run: dotnet restore DesktopBinarizer.sln

      - name: Build
        run: dotnet build DesktopBinarizer.sln --configuration Release --no-restore

      - name: Run smoke tests
        run: dotnet run --project tests/DesktopBinarizer.SmokeTests/DesktopBinarizer.SmokeTests.csproj --configuration Release --no-build
